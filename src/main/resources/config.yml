# Yunit - Yaycraft Unified Network Token
# Veritabanı Yapılandırması
database:
  host: "localhost"
  port: 3306
  database: "yunit"
  username: "root"
  password: "password"
  use-ssl: false
  pool:
    maximum-pool-size: 15
    minimum-idle: 3
    connection-timeout: 5000
    idle-timeout: 300000
    max-lifetime: 600000

# Redis Ayarları
# Eğer password kısmını boş bırakırsanız ("") şifresiz bağlanır.
redis:
  enabled: false
  host: "localhost"
  port: 6379
  password: ""

# Önbellek Ayarları
cache:
  expire-after-write-seconds: 30
  maximum-size: 2000

# Sunucu Tanımlama (her sunucuda farklı olmalı)
# !!! Aynı veritabanını kullanan HER SUNUCUDA FARKLI olmalıdır !!!
# Yarım kalan satın almalar bu isme göre iade edilir; iki sunucu aynı ismi
# kullanırsa biri yeniden başladığında diğerinin işlemlerini iade edebilir.
server-name: "survival"

# Para Birimi
currency:
  symbol: "*"
  name: "Yunit"

# Güvenlik Ayarları
safety:
  # Aynı oyuncunun arka arkaya satın alma/çekme işlemleri arasındaki en kısa süre
  transaction-cooldown-ms: 500
  # Veritabanı bağlantısı bu aralıkla kontrol edilir; koparsa işlemler geçici olarak durur
  health-check-interval-seconds: 10
  # Sunucu çökerse yarım kalan (para çekilmiş ama teslim edilmemiş) satın almalar
  # açılışta otomatik iade edilsin mi? false ise sadece konsola listelenir.
  recovery-auto-refund: true

# Debug modu
debug: false
